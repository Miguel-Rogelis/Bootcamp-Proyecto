<div class="auth-container">
    <div class="auth-card">
        <a routerLink="/" class="auth-logo">MR</a>
        <h2>Iniciar sesión</h2>

        @if (mensajeError) {
            <div class="alerta alerta-error">{{ mensajeError }}</div>
        }

        <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="campo-grupo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required class="campo">
            </div>
            <div class="campo-grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required class="campo">
            </div>
            <div class="campo-extra">
                <a routerLink="/recuperar-password" class="link-secundario">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn-primario" [disabled]="cargando || !loginForm.form.valid">
                @if (cargando) { Entrando... } @else { Entrar }
            </button>
        </form>

        <p class="auth-link">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>
</div>
