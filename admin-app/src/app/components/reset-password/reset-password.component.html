<div class="auth-container">
    <div class="auth-card">
        <a routerLink="/" class="auth-logo">MR</a>
        <h2>Nueva contraseña</h2>

        @if (mensajeError) {
            <div class="alerta alerta-error">{{ mensajeError }}</div>
        }
        @if (mensajeExito) {
            <div class="alerta alerta-exito">{{ mensajeExito }}</div>
        }

        @if (tokenPresente && !mensajeExito) {
            <form (ngSubmit)="onRestablecer()" #resetForm="ngForm">
                <div class="campo-grupo">
                    <label for="password">Nueva contraseña</label>
                    <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6" class="campo">
                </div>
                <div class="campo-grupo">
                    <label for="confirmarPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmarPassword" name="confirmarPassword" [(ngModel)]="confirmarPassword" required minlength="6" class="campo">
                </div>
                <button type="submit" class="btn-primario" [disabled]="cargando || !resetForm.form.valid">
                    @if (cargando) { Guardando... } @else { Guardar nueva contraseña }
                </button>
            </form>
        }

        <p class="auth-link">
            @if (!tokenPresente) {
                <a routerLink="/recuperar-password">Solicitar un nuevo enlace</a>
            } @else {
                <a routerLink="/login">Volver a iniciar sesión</a>
            }
        </p>
    </div>
</div>
