<div class="auth-container">
    <div class="auth-card">
        <a routerLink="/" class="auth-logo">MR</a>
        <h2>Crear cuenta</h2>

        @if (mensajeError) {
            <div class="alerta alerta-error">{{ mensajeError }}</div>
        }
        @if (mensajeExito) {
            <div class="alerta alerta-exito">{{ mensajeExito }}</div>
        }

        <form (ngSubmit)="onRegistrar()" #registerForm="ngForm">
            <div class="campo-grupo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required class="campo">
            </div>
            <div class="campo-grupo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required class="campo">
            </div>
            <div class="campo-grupo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" [(ngModel)]="password" required minlength="6" class="campo">
            </div>
            <button type="submit" class="btn-primario" [disabled]="cargando || !registerForm.form.valid">
                @if (cargando) { Creando cuenta... } @else { Registrarme }
            </button>
        </form>

        <p class="auth-link">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
</div>
